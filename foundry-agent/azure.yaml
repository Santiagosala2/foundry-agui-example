# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ai-project
services:
    ai-project:
        host: azure.ai.project
        endpoint: https://aif-test.services.ai.azure.com/api/projects/ai-project
    travel-agent:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_14
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        kind: hosted
        name: travel-agent
        protocols:
            - protocol: invocations
              version: 1.0.0
infra:
    provider: microsoft.foundry
